services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scenemaker
      POSTGRES_PASSWORD: scenemaker
      POSTGRES_DB: scenemaker
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    command: sh -c "alembic upgrade head && scenemaker api"
    env_file: .env
    environment:
      SCENEMAKER_DATABASE_URL: postgresql+psycopg://scenemaker:scenemaker@db:5432/scenemaker
      SCENEMAKER_REDIS_URL: redis://redis:6379/0
      SCENEMAKER_QUEUE_BACKEND: redis
      SCENEMAKER_STORAGE_LOCAL_DIR: /data
    volumes: [storage:/data]
    ports: ["8000:8000"]
    depends_on: [db, redis]

  worker:
    build: .
    command: scenemaker worker
    env_file: .env
    environment:
      SCENEMAKER_DATABASE_URL: postgresql+psycopg://scenemaker:scenemaker@db:5432/scenemaker
      SCENEMAKER_REDIS_URL: redis://redis:6379/0
      SCENEMAKER_QUEUE_BACKEND: redis
      SCENEMAKER_STORAGE_LOCAL_DIR: /data
    volumes: [storage:/data]
    depends_on: [db, redis]

volumes:
  pgdata:
  storage:
